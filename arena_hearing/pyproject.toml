[project]
name = "arena_hearing"
version = "0.0.0"
dependencies = [
    "attrs",
    "huggingface-hub",
    "librosa",
    "matplotlib",
    "numpy",
    "pyarrow",
    "pyyaml",
    "scipy",
    "torch",
]
dynamic = ["description", "license", "maintainers", "scripts"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ros: requires a sourced ROS2 environment",
    "slow: long-running tests",
]
